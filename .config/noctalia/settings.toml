config_version = 14

[bar]
order = [ "top", "bottom" ]

    [bar.bottom]
    background_opacity = 0.4999999888241291
    center = [ "privacy" ]
    end = [ "media", "tray", "notifications", "network", "brightness", "bluetooth", "volume", "battery", "clock" ]
    font_weight = 400
    margin_ends = 0
    radius = 0
    start = [ "workspaces" ]
    thickness = 25
    widget_spacing = 10

    [bar.top]
    background_opacity = 0.4999999888241291
    center = []
    end = [ "clipboard", "wallpaper", "cpu", "temp", "ram", "session" ]
    font_weight = 400
    margin_ends = 0
    position = "bottom"
    radius = 0
    start = [ "launcher", "taskbar" ]
    thickness = 25
    widget_spacing = 10

[control_center]
sidebar = "full"

[dock]
background_opacity = 0.59999999999999998
position = "top"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1920.0
    cy = 1977.999755859375
    output = "DP-3"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.59999999999999998

[osd]
background_opacity = 0.59999999999999998

[plugin_settings."local/solar-position-wallpaper"]
latitude = 39.0
wallpaper_folder = "/home/user1/Pictures/walls/mojave_hours"

[plugin_settings."local/sun-position-wallpaper"]
wallpaper_path = "/home/user1/Pictures/walls/mojave_hours/266_5.png"

[plugin_settings."thsr/solar-dynamic-wallpaper"]
wallpaper_folder = "/home/user1/Pictures/walls/mojave_hours"

[plugins]
auto_update = "all"
enabled = [ "local/solar-position-wallpaper", "thsr/solar-dynamic-wallpaper" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/dev/noctalia-plugins"
    name = "my-plugins"

[shell]
button_borders = false

    [shell.animation]
    speed = 3.35000004991889

    [shell.launcher]
    compact = true
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 2.0
    enabled = true
    shortcut = "0"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 2.0
    enabled = true
    shortcut = "o"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 2.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 2.0
    enabled = true
    shortcut = "s"
    variant = "secondary"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl reboot --firmware-setup"
    countdown_seconds = 2.0
    enabled = true
    glyph = "cpu"
    label = "UEFI"
    shortcut = "u"
    variant = "default"

[theme]
community_palette = "Monochrome"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/home/user1/Pictures/walls"
edge_smoothness = 0.73999998345971107
transition = [ "fade" ]
transition_duration = 30000

    [wallpaper.default]
    path = "/home/user1/Pictures/walls/mojave_hours/309_-39.png"

    [wallpaper.last]
    path = "/home/user1/Pictures/walls/mojave_hours/309_-39.png"

    [wallpaper.monitors.DP-3]
    path = "/home/user1/Pictures/walls/mojave_hours/309_-39.png"

[widget.clock]
format = "%a %b %d %l:%M %p"

[widget.launcher]
glyph = "grid-dots"

[widget.media]
hide_when_no_media = true

[widget.taskbar]
only_active_workspace = true
show_window_title = true
window_title_max_width = 150